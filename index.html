<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>미룬 일 몬스터 동네</title>
    <style>
      :root {
        --ink: #2b2433;
        --paper: #fff8ea;
        --line: #d9c9a4;
        --accent: #e0893a;
        --soft: #f3e6c8;
      }
      html, body { margin: 0; height: 100%; background: #1d1b2a; overflow: hidden; }
      body { display: flex; font: 14px/1.45 system-ui, sans-serif; color: var(--ink); }
      #game { flex: 1; min-width: 0; height: 100%; }
      canvas { image-rendering: pixelated; display: block; }

      #panel {
        width: 320px; flex-shrink: 0; height: 100%; overflow-y: auto; box-sizing: border-box;
        padding: 16px; background: var(--paper); border-left: 4px solid var(--ink);
      }
      #panel h2 { font-size: 15px; margin: 0 0 8px; }
      #panel section { margin-top: 20px; }
      #panel form { display: grid; gap: 8px; }
      #panel label { display: grid; grid-template-columns: 36px 1fr; align-items: center; font-size: 13px; }
      #panel input { font: inherit; padding: 6px 8px; border: 2px solid var(--line); border-radius: 6px; background: #fff; min-width: 0; }
      #panel button { font: inherit; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
      #panel button.ghost { background: transparent; color: var(--ink); }
      #panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      #panel li { padding: 10px; border: 2px solid var(--line); border-radius: 8px; background: #fff; }
      #panel li.focusing { border-color: #7aa6d6; background: #eef5fd; }
      #panel li.empty { color: #7b6f80; border-style: dashed; background: transparent; }
      #panel .row { display: flex; justify-content: space-between; gap: 8px; }
      #panel .meta { font-size: 12px; color: #6b5f70; margin: 4px 0 8px; }
      #panel .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
      #panel .buttons button { padding: 4px 8px; font-size: 13px; }
      #panel .error { color: #c0392b; margin: 0; font-size: 13px; }
      #panel .dex { margin: 0; }
      #panel .toast {
        position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); margin: 0;
        padding: 10px 16px; background: var(--ink); color: #fff; border-radius: 8px; max-width: 80vw;
      }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 6px 10px;
        font-size: 13px; color: #fff; background: rgba(29, 27, 42, 0.7); border-radius: 6px; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <aside id="panel"></aside>
    <div id="hud">방향키/WASD: 이동 · 위쪽 문으로 나가면 광장과 친구 마당이 있어요</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
